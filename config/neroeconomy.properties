#NeroEconomy server-authoritative configuration.
#startingBalance: Credits paid from the Reserve when a player account is first opened; less, or nothing, when the Reserve cannot cover it. (default 100; server-authoritative)
#startingBalanceVestMinutes: Play time, in minutes, before a starting balance can be paid, offered or bid to another player. Until then it only pays fees and system counterparties. 0 turns the lock off. (default 30; server-authoritative)
#transactionRetentionDays: Audit retention in days; 0 keeps no records. (default 90; server-authoritative)
#maxTransactionRecords: Hard server-wide audit record bound. (default 10000; server-authoritative)
#historyLimitPerPlayer: Maximum records returned to one player. (default 100; server-authoritative)
#adminMutationsEnabled: Allow the permission-level-3 grant/take/set commands, accepting a fresh start for a frozen economy, and the admin gallery. (default true; server-authoritative)
#maxPriceMultiplier: Maximum market-shock multiplier after all modifiers. (default 4.0; server-authoritative)
#minPriceMultiplier: Minimum market-shock multiplier after all modifiers. (default 0.25; server-authoritative)
#executionPriceTolerance: Symmetric quote-to-execution tolerance kept for API callers of executionPriceAccepted. Purchases ignore it: a buyer is never charged above the confirmed price. (default 0.05; server-authoritative)
#defaultListingDurationHours: Default market offer lifetime. (default 48; server-authoritative)
#auctionAntiSnipeSeconds: Late-bid auction extension window. (default 60; server-authoritative)
#auctionMinIncrementPercent: A bid must beat the standing bid by at least this percentage, and always by 1 credit. (default 5; server-authoritative)
#jobClaimTimeoutMinutes: A claimed job reopens after this long without fulfilment; 0 never releases a claim. (default 120; server-authoritative)
#shopListingMaxIdleDays: A shop listing with no owner interaction and no sale for this long expires into the owner's vault; 0 never expires one. (default 90; server-authoritative)
#maxListingsPerPlayer: Market Board sell listings one account may have open; 0 refuses new ones. Player Shop listings are bounded by placed shops and are not counted. (default 64; server-authoritative)
#maxBuyOffersPerPlayer: Standing buy offers one account may have open; 0 refuses new ones. (default 32; server-authoritative)
#maxJobsPerPlayer: Unsettled contracts, deliveries and bounties one account may have posted; 0 refuses new ones. (default 16; server-authoritative)
#maxAuctionsPerPlayer: Running auctions one account may have; 0 refuses new ones. (default 8; server-authoritative)
#maxClaimStacksPerPlayer: Stacks one account's vault may hold before purchases, bids, fills and cancels that would deliver more to it are refused. The smaller of this and vaultStacks applies, so it only matters when set below vaultStacks. Refunds and expiry always book. (default 256; server-authoritative)
#vaultStacks: Stacks a player may keep in their vault, in whole rows of nine (a value in between is rounded down). Goods bought while away, refunds and expired listings are delivered there. Refunds and expiry always book, even past this; deposits and purchases to the vault are then refused until it is back under it. (default 54; server-authoritative)
#simStepMinutes: Length of one simulation step, in minutes of economy time. The economy advances in these steps whether or not anyone is online; it never follows game ticks, the day/night cycle, /tick, /time or sleeping. (default 10; server-authoritative)
#simCatchUpMaxHours: After a pause or a shutdown the missed steps are replayed, a few per tick. At most this many hours' worth are replayed; anything older is skipped. (default 72; server-authoritative)
#autonomousEconomy: Run the parts of the simulation that act in the market on their own (Merchant Houses, the exchange, system jobs). false leaves only housekeeping: the Reserve top-up, the day roll-over and expiry. (default true; server-authoritative)
#commoditySpreadPercent: How far above a commodity's reference price the Merchant Houses sell it and how far below they buy it, as a percentage, for a commodity whose data file gives no spread_percent. Applies from the next data-pack reload. (default 10.0; server-authoritative)
#arbitrageGuardDepth: How many recipes long a chain the arbitrage guard follows when it checks that goods bought from the Merchant Houses cannot be crafted and sold back to them at a profit. (default 3; server-authoritative)
#referenceDriftStepPercent: The most a commodity's reference price may move toward what players pay each other in one simulation step, as a percentage of the reference price in its data file. 0 keeps every reference price where the data puts it. (default 1.0; server-authoritative)
#referenceBandMinPercent: The lowest a commodity's reference price may drift to, as a percentage of the reference price in its data file. (default 50.0; server-authoritative)
#referenceBandMaxPercent: The highest a commodity's reference price may drift to, as a percentage of the reference price in its data file. (default 200.0; server-authoritative)
#referenceMinTradeValue: A sale between two players worth less than this many credits does not count toward reference prices. (default 16; server-authoritative)
#referenceAccountDailyCap: Credits of one player account's sales and purchases with other players that count toward reference prices per economy day, so a few accounts trading with each other cannot move a price far. 0 counts none. (default 2000; server-authoritative)
#referenceMinPairs: How many different pairs of players must have traded a commodity with each other since the last simulation step before its reference price moves at all, so two accounts trading with each other cannot move it. No one pair counts for more than the pair that ranks this many places from the top. (default 3; server-authoritative)
#referenceDriftDayPercent: The most a commodity's reference price may move in one economy day, up or down from where the day began, as a percentage of the reference price in its data file. 0 keeps every reference price where the day began. (default 10.0; server-authoritative)
#npcAuctionsPerDay: Auctions the Merchant Houses start from their own stock per economy day, server-wide: a few rare or valuable goods, or a bundle of a staple. 0 switches them off. (default 4; server-authoritative)
#npcAuctionHours: How long, in hours of economy time, an auction a Merchant House starts runs. (default 24; server-authoritative)
#houseJobPremiumPercent: What a Merchant House's contract or delivery job pays above the House's current buying price for the goods, as a percentage. The payout comes from the Reserve within systemJobDailyPayoutCap. (default 15.0; server-authoritative)
#houseJobsPerHouse: Open contract and delivery jobs one Merchant House may have for goods it is short of; 0 switches House jobs off. (default 2; server-authoritative)
#houseJobHours: How long, in hours of economy time, a Merchant House's job or a server bounty stays open. An expired one returns its payout to the Reserve. (default 24; server-authoritative)
#systemBountiesPerDay: Server-funded bounties on hostile mobs (listed in the bounty data files) posted per economy day, and the most open at once. Mob farms complete any kill bounty, so keep this small; 0 switches them off. (default 2; server-authoritative)
#debugFastSim: Development only: one simulation step per second of real time. Ignored, with a warning in the log, outside a development environment. (default false; server-authoritative)
#maxStackDataBytes: Largest encoded size, in bytes of NBT, of a stack that may be listed, auctioned or put in a shop. (default 8192; server-authoritative)
#creditChipValue: Credits the Reserve pays for an account's first Credit Chip of the economy day. Each further chip that day pays less: 80, 60, 40, then 20 percent of this. (default 100; server-authoritative)
#creditChipDailyLimit: Credit chips one account may redeem per economy day; 0 disables redemption. (default 5; server-authoritative)
#creditChipDailyBudget: Credits the Reserve pays for Credit Chips per economy day, all accounts together, on top of creditChipDailyLimit per account. A chip refused because it is spent is kept. 0 stops chip payouts. (default 3000; server-authoritative)
#systemJobsEnabled: Allow server-funded jobs, whose payouts come out of the Reserve; false refuses every new one. (default true; server-authoritative)
#systemJobDailyPayoutCap: Total payout of the server-funded jobs that may be posted per economy day. The payout is moved from the Reserve into escrow when the job is posted. (default 5000; server-authoritative)
#reserveInitial: Credits minted into the Reserve once, when a world's economy is first created or migrated. (default 250000; server-authoritative)
#reserveDailyMint: Credits minted into the Reserve once per economy day; skipped while the Reserve is at or above reserveCap. At most three missed days are made up. (default 5000; server-authoritative)
#reserveCap: The daily top-up stops when the Reserve holds this much; fees may still take it higher. (default 2000000; server-authoritative)
#npcDailyBudget: Most the Merchant Houses may pay out to players per economy day. (default 20000; server-authoritative)
#exchangeDailyBudget: Most the exchange may pay in gains, dividends and newly reserved bond interest per economy day. (default 15000; server-authoritative)
#siblingDailyBudget: Most that other mods together may draw from the Reserve per economy day: payouts through the cross-mod API and deposits made without a reason of their own. A payout past it is refused. (default 5000; server-authoritative)
#siblingCallerDailyBudget: Most one other mod may pay out through the cross-mod API per economy day, unless siblingCallerBudgets names it. siblingDailyBudget still caps all of them together. (default 2500; server-authoritative)
#siblingCallerBudgets: Per-mod daily payout limits that replace siblingCallerDailyBudget, as a comma-separated list of modid=amount, for example neroquests=3000,nerocolonies=1500. (default ; server-authoritative)
#siblingPerPlayerDailyCap: Most all other mods together may pay one player through the cross-mod API per economy day; 0 turns the cap off and keeps no per-player count. (default 2000; server-authoritative)
#siblingMaxSinglePayout: Largest single payout another mod may make through the cross-mod API. (default 1000; server-authoritative)
#siblingTransferFeePercent: Fee on a player-to-player transfer another mod makes through the cross-mod API, taken from what the payee receives, rounded up and at least 1 credit; 0 charges nothing. Paid to the Reserve. (default 5.0; server-authoritative)
#reserveAlertLow: Reserve level other mods are told about through Core (neroeconomy:reserve): once when it falls below this, once when it recovers. (default 25000; server-authoritative)
#sectorBands: Percent moves from a sector's day open that other mods are told about through Core (neroeconomy:sector_index), as a comma-separated list, for example 5,10. (default 5,10; server-authoritative)
#shockSources: Mods whose market-shock requests through Core (<modid>:market_shock_request) are applied, as a comma-separated list of mod ids. Empty hears none. (default neroevents; server-authoritative)
#shockMaxMinutes: Longest market shock another mod may request, in economy-minutes. (default 1440; server-authoritative)
#maxActiveShocks: Most market shocks requested by other mods that may be active at once. (default 64; server-authoritative)
#marketFeePercent: Fee on the seller's proceeds of every Market Board sale, shop sale and filled buy offer, rounded up and at least 1 credit; 0 charges nothing. Paid to the Reserve. (default 2.0; server-authoritative)
#listingFee: Flat fee for posting a Market Board listing or a buy offer; not refunded. Paid to the Reserve. (default 1; server-authoritative)
#auctionFeePercent: Fee on the winning bid, taken from the seller's proceeds, rounded up and at least 1 credit; 0 charges nothing. Paid to the Reserve. (default 5.0; server-authoritative)
#exchangeFeePercent: Fee on every share and index purchase and sale, rounded up and at least 1 credit; 0 charges nothing. Savings Bonds carry no fee. Paid to the Reserve. (default 1.0; server-authoritative)
#exchangeEnabled: Run the exchange: the prices of the listed companies move once per simulation step, and shares, the index fund and Savings Bonds can be bought and sold. false leaves every price where it is and refuses every purchase and sale; a Savings Bond can still be cashed in and still pays out at maturity. autonomousEconomy=false stops the prices and the dividends, but not trading. (default true; server-authoritative)
#exchangeStepLimitSteadyPercent: Most a steady share's price may move in one simulation step, as a percentage. (default 2.0; server-authoritative)
#exchangeStepLimitRiskyPercent: Most a risky share's price may move in one simulation step, as a percentage. (default 6.0; server-authoritative)
#exchangeDayLimitSteadyPercent: Most a steady share's price may be above or below its price at the start of the economy day, as a percentage. A share that gets there is halted. (default 10.0; server-authoritative)
#exchangeDayLimitRiskyPercent: Most a risky share's price may be above or below its price at the start of the economy day, as a percentage. A share that gets there is halted. (default 40.0; server-authoritative)
#exchangeHaltSteps: Simulation steps a share is halted for after reaching its daily limit: its price stands still and it cannot be bought or sold. 6 steps are one hour at the default step length. 0 never halts. (default 6; server-authoritative)
#exchangeReversionPercent: How much of the gap between a share's price and its anchor closes in one simulation step, as a percentage. Higher keeps prices closer to their trend. (default 0.05; server-authoritative)
#exchangeVolumeNudgeCapPercent: Most that trade in a company's linked items may move its share price in one simulation step, up or down, as a percentage. 0 turns the link off. (default 0.5; server-authoritative)
#exchangeVolumeScale: Credits of counted trade above (or below) the usual level, in one simulation step, that move a share price by the whole of exchangeVolumeNudgeCapPercent. (default 2000; server-authoritative)
#exchangeVolumePairCap: Credits of trade between the same two player accounts that count toward share prices per simulation step, so two accounts trading back and forth cannot move a price. (default 250; server-authoritative)
#exchangeVolumeAccountCap: Credits of one player account's trade that count toward share prices per simulation step. (default 1000; server-authoritative)
#exchangeShockStepPercent: How much of an active market shock on a company or its linked items reaches its share price in one simulation step, as a percentage. 0 keeps shocks out of the exchange. (default 1.0; server-authoritative)
#exchangeFloorPercent: A share price never falls below this percentage of the company's start price, nor below 0.01 credit. (default 5.0; server-authoritative)
#bondRate1DayPercent: Interest a 1-day Savings Bond pays for its whole term, as a percentage of what was put in. (default 0.8; server-authoritative)
#bondRate3DayPercent: Interest a 3-day Savings Bond pays for its whole term, as a percentage of what was put in. (default 3.0; server-authoritative)
#bondRate7DayPercent: Interest a 7-day Savings Bond pays for its whole term, as a percentage of what was put in. (default 8.0; server-authoritative)
#exchangeSpreadSteadyPercent: Gap between what a steady share is bought at and what it is sold at, as a percentage of its price: half goes on top of the price when buying and half comes off it when selling. Buying and selling at once therefore always loses. (default 1.0; server-authoritative)
#exchangeSpreadRiskyPercent: The same gap for a risky share. (default 2.0; server-authoritative)
#exchangeSpreadIndexPercent: The same gap for the index fund. (default 1.0; server-authoritative)
#shareHoldMinutes: Minutes of economy time before shares or index units that were just bought can be sold. 0 turns the holding period off. (default 60; server-authoritative)
#maxPositionPerStock: Most credits one account may have in one stock or in the index fund, counted at what was paid for the units still held; 0 refuses every purchase. (default 5000; server-authoritative)
#maxPortfolio: Most credits one account may have on the exchange altogether - shares, index fund and Savings Bonds - counted at what was paid in. (default 20000; server-authoritative)
#maxBondsPerPlayer: Savings Bonds one account may hold at a time; 0 refuses new ones. (default 8; server-authoritative)
#practiceStartingCredits: Play credits a practice portfolio starts with and is reset to. They are not credits: nothing converts between practice and the real economy. (default 10000; server-authoritative)
#exchangeActionsPerMinute: Buys, sells and bond actions one account may make on the exchange per minute; practice is counted separately, at the same rate. (default 20; server-authoritative)
#tradeTaxPercent: Tax on the credits side of a direct trade or an accepted offer, rounded up and at least 1 credit; 0 charges nothing. Paid to the Reserve. (default 0.0; server-authoritative)
#tradeRangeBlocks: How close two players must be, in blocks and in the same dimension, to trade directly with each other. Two players who are each at an economy terminal can trade from any distance. (default 16; server-authoritative)
#offerDurationHours: Hours an offer sent to another player stays open. An unanswered offer then expires and everything in it goes back to the sender. (default 48; server-authoritative)
#maxOffersPerPlayer: Open offers one account may have sent at a time; 0 refuses new ones. Separately, an account can have at most 64 offers waiting for its answer. (default 16; server-authoritative)
#maxRulesPerPlayer: Auto-buy and auto-sell rules one account may have; 0 refuses new ones. (default 8; server-authoritative)
#ruleDailyValueCap: Credits' worth of trades all of one account's rules together may fill per economy day. Reaching it pauses that account's rules until the next day. (default 10000; server-authoritative)
#playerBountiesEnabled: Allow bounties on a named player. Posting one also requires permission level 2. (default false; server-authoritative)
#remoteTradeEnabled: Allow validated NeroLink trade actions. (default true; server-authoritative)
#remoteDailySpendLimit: Credits one account may spend per economy day through companion-app actions, all of them together: purchases, buy-order escrow, rule budgets, shares, bonds, payments and offers. It is the most a stolen app token can cost a player in a day. 0 allows no spending from the app. (default 5000; server-authoritative)
#remoteDailyGoodsLimit: Credits' worth of goods that may leave one account per economy day through companion-app actions, all of them together: goods in offers, sell orders and sell rules from the vault, goods an accepted offer asks for. Counted apart from remoteDailySpendLimit, so the two together are the most a stolen app token can cost a player in a day. 0 lets no goods leave through the app. (default 5000; server-authoritative)
#remoteGoodsFloorValue: Credits one unit of unmodified goods that are no commodity counts as against remoteDailyGoodsLimit. A commodity counts at its reference price. (default 10; server-authoritative)
#remoteModifiedGoodsValue: Credits one unit of modified goods (renamed, enchanted, or holding contents such as a filled shulker box) counts as against remoteDailyGoodsLimit, or its item's reference price if higher. (default 500; server-authoritative)
#giveHandbookOnFirstJoin: Give each player one Trader's Handbook the first time they join (never in spectator mode, never twice); with a full inventory it goes to their vault. The book is craftable either way. (default true; server-authoritative)
#telemetryEnabled: Send anonymous NeroEconomy-only crash reports (Sentry, EU servers). On by default; set false to opt out (client-local, takes effect on restart). No player data is sent. See PRIVACY.md. (default true)
