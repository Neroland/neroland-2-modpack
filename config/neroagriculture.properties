#NeroAgriculture discovery, cultivation and automation settings
#discovery.scan_cap: Maximum enabled catalog entries exposed and considered for client sync (default 512; server-authoritative)
#discovery.material_blacklist: Comma-separated material ids disabled before exposure (default ; server-authoritative)
#discovery.material_overrides: Semicolon entries: id|tier=orbite|gate=id|yield=min:max:ramp|conversion=n|enabled=true (default ; server-authoritative)
#discovery.default_tier: Tier assigned to auto-discovered materials no heuristic recognises (territe|forgite|orbite|colonite|voidite); invalid values fall back to orbite (default orbite; server-authoritative)
#condensation.ticks: condensation.ticks (default 200; server-authoritative)
#machines.energy_capacity: machines.energy_capacity (default 100000; server-authoritative)
#machines.energy_rate: machines.energy_rate (default 80; server-authoritative)
#machines.fluid_capacity_mb: machines.fluid_capacity_mb (default 8000; server-authoritative)
#grow_beds.energy_per_growth: grow_beds.energy_per_growth (default 40; server-authoritative)
#grow_beds.nutrient_per_growth_mb: grow_beds.nutrient_per_growth_mb (default 25; server-authoritative)
#growth.multiplier: growth.multiplier (default 1.0; server-authoritative)
#growth.yield_multiplier: growth.yield_multiplier (default 1.0; server-authoritative)
#growth.seed_return_percent: growth.seed_return_percent (default 10; server-authoritative)
#growth.tier_yield_cap_base: growth.tier_yield_cap_base (default 3; server-authoritative)
#growth.tier_yield_cap_step: growth.tier_yield_cap_step (default 1; server-authoritative)
#growth.controlled_tier: Lowest tier that always requires a sealed greenhouse (territe|forgite|orbite|colonite|voidite) (default orbite; server-authoritative)
#greenhouse.volume_cap: greenhouse.volume_cap (default 4096; server-authoritative)
#greenhouse.revalidate_ticks: greenhouse.revalidate_ticks (default 100; server-authoritative)
#greenhouse.upkeep_ticks: greenhouse.upkeep_ticks (default 20; server-authoritative)
#greenhouse.nf_per_32_volume: greenhouse.nf_per_32_volume (default 2; server-authoritative)
#greenhouse.nutrient_mb_per_crop: greenhouse.nutrient_mb_per_crop (default 1; server-authoritative)
#greenhouse.oxygen_cap_per_32_volume: greenhouse.oxygen_cap_per_32_volume (default 8; server-authoritative)
#greenhouse.oxygen_nf_per_unit: greenhouse.oxygen_nf_per_unit (default 4; server-authoritative)
#bioreactor.biomass_per_cycle: bioreactor.biomass_per_cycle (default 2; server-authoritative)
#bioreactor.nutrient_mb_per_cycle: bioreactor.nutrient_mb_per_cycle (default 400; server-authoritative)
#bioreactor.waste_byproduct_percent: bioreactor.waste_byproduct_percent (default 25; server-authoritative)
#bioreactor.process_ticks: bioreactor.process_ticks (default 100; server-authoritative)
#biofuel.biomass_per_cycle: biofuel.biomass_per_cycle (default 3; server-authoritative)
#biofuel.biofuel_mb_per_cycle: biofuel.biofuel_mb_per_cycle (default 250; server-authoritative)
#biofuel.waste_byproduct_percent: biofuel.waste_byproduct_percent (default 20; server-authoritative)
#biofuel.process_ticks: biofuel.process_ticks (default 120; server-authoritative)
#biofuel.energy_nf_per_mb: biofuel.energy_nf_per_mb (default 3; server-authoritative)
#biofuel.primary_generation_ceiling_nf_per_mb: biofuel.primary_generation_ceiling_nf_per_mb (default 8; server-authoritative)
#crop_tower.min_height: crop_tower.min_height (default 3; server-authoritative)
#crop_tower.max_height: crop_tower.max_height (default 12; server-authoritative)
#crop_tower.slots_per_layer: crop_tower.slots_per_layer (default 4; server-authoritative)
#crop_tower.slots_per_pass: crop_tower.slots_per_pass (default 6; server-authoritative)
#crop_tower.revalidate_ticks: crop_tower.revalidate_ticks (default 100; server-authoritative)
#crop_tower.hostile_environment_nf_multiplier: NF cost multiplier a tower layer pays when its environment would fail the crop's climate check (towers keep growing in hostile environments, at this surcharge) (default 4; server-authoritative)
#crop_tower.output_event_threshold: items crop towers in one dimension may harvest in the last in-game hour (1,000 game ticks) before the neroagriculture:tower_output threshold event fires (rising when reached, falling when back below); 0 disables the event (default 512; server-authoritative)
#fusion.enabled: Enable fragment-fusion (alloy) recipes that combine two resources into an alloy seed (default true; server-authoritative)
#fusion.max_tier: Highest tier an alloy seed may be fused at (territe|forgite|orbite|colonite|voidite); alloys whose resource sits above this tier cannot be fused (default voidite; server-authoritative)
#progression.require_research: Require materials to be researched at the Seed Research Bench before synthesis/conversion (on by default; hard tier gates remain off) (default true; server-authoritative)
#progression.sibling_overlays: Whether higher tiers ALSO require a sibling mod's Core arc gate: off (default \u2014 no hard gates), auto (only when the opener mod is loaded), or on (always) (default off; server-authoritative)
#compat.nerospace_visits: Grant material_discovered for planet-bound materials from Nerospace planet visits \u2014 live dimension entry plus, with Nerospace 1.0.0-beta.8+, historical visit backfill on join; off leaves planet-bound research locked to visits that are never recorded (default true; server-authoritative)
#cycles.enabled: Enable seasonal/stellar-cycle growth and yield modifiers (default true; server-authoritative)
#terraforming.enabled: Allow terraforming projects to make a region habitable in Agriculture's environment model (default true; server-authoritative)
#terraforming.region_radius: terraforming.region_radius (default 8; server-authoritative)
#terraforming.total_progress: terraforming.total_progress (default 6000; server-authoritative)
#terraforming.progress_per_tick: terraforming.progress_per_tick (default 2; server-authoritative)
#terraforming.energy_per_tick: terraforming.energy_per_tick (default 20; server-authoritative)
#terraforming.nutrient_mb_per_tick: terraforming.nutrient_mb_per_tick (default 2; server-authoritative)
#automation.interval_ticks: automation.interval_ticks (default 20; server-authoritative)
#automation.range: automation.range (default 8; server-authoritative)
#automation.columns_per_pass: automation.columns_per_pass (default 4; server-authoritative)
#automation.energy_per_op: automation.energy_per_op (default 60; server-authoritative)
#automation.track_owner: Record the placing player's UUID (only) on automation machines for claim checks; opt-out (default true; server-authoritative)
#privacy.erasure_retention_days: Days an erasure request's UUID tombstone is kept so owners saved in unloaded chunks are still purged when those chunks load; pruned automatically afterwards (default 90; server-authoritative)
#fertiliser.max_dose: fertiliser.max_dose (default 8; server-authoritative)
#fertiliser.duration_ticks: fertiliser.duration_ticks (default 6000; server-authoritative)
#fertiliser.energy_per_apply: fertiliser.energy_per_apply (default 40; server-authoritative)
#genetics.hardiness_hostile_relax: genetics.hardiness_hostile_relax (default 3; server-authoritative)
#genetics.pollination_chance_percent: genetics.pollination_chance_percent (default 6; server-authoritative)
#genetics.mutation_chance_percent: genetics.mutation_chance_percent (default 20; server-authoritative)
#genetics.pollination_cooldown_ticks: genetics.pollination_cooldown_ticks (default 200; server-authoritative)
#genetics.beacon_range: genetics.beacon_range (default 4; server-authoritative)
#dimensions.allowlist: dimensions.allowlist (default ; server-authoritative)
#dimensions.denylist: dimensions.denylist (default ; server-authoritative)
#telemetryEnabled: anonymous error reporting to the developers (stack trace + mod/MC/loader/OS/Java versions only \u2014 never names, UUIDs, IPs, or world data; POPIA/GDPR-compliant). On by default; set false to opt out (takes effect on restart). See PRIVACY.md (default true)
