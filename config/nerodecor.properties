#NeroDecor configuration.
#connectedTextures: Draw NeroDecor hull/panel/glass/neon surfaces with in-house connected textures. Disable if a resource pack conflicts or for maximum performance (falls back to flat tiles). (default true)
#emissiveRendering: Render neon/holo/rack glow layers fullbright (emissive). Disable on low-end clients. (default true)
#ambientParticles: Let Luminous-collection blocks release occasional ambient particles (star glints, void-rift specks, conduit sparks, crystal glints, spores, vent wisps). Client-side only. (default true)
#ambientSounds: Let Luminous-collection blocks make their soft ambient sounds (circuit chirps, void hum, crystal chimes, conduit crackle, vent hiss, lamp hum). Client-side only; each sound is rate-limited so large builds stay quiet. (default true)
#telemetryEnabled: Send anonymous, NeroDecor-only crash reports (Sentry, EU servers): stack trace, mod/MC/loader/OS/Java versions, your other installed mods, and this mod's config; no IP, username, UUID, world data or chat; file paths are scrubbed of your account name. On by default; set false to opt out (takes effect on restart). See PRIVACY.md. (default true)
#Tue Oct 13 22:02:56 SAST 2026
ambientParticles=true
ambientSounds=true
connectedTextures=true
emissiveRendering=true
telemetryEnabled=true
