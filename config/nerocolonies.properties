#NeroColonies configuration.
#telemetryEnabled: send anonymous, NeroColonies-only crash reports (Sentry, EU servers) - stack trace, mod/MC/loader/OS/Java versions, your other installed mods, this mod's config, an anonymous per-launch session marker; no IP, username, UUID, world data, colony ownership or chat; file paths scrubbed of your account name. On by default; false = opt out of all of it (client-local, takes effect on restart). See PRIVACY.md (default true)
#maxColoniesPerPlayer: How many colonies one player may own at once. 0 disables founding new colonies. (default 3; server-authoritative)
#maxColoniesTotal: Server-wide colony cap. The safety net behind the per-player cap; also bounds how much work the colony tick can ever create. (default 200; server-authoritative)
#claimRadius: Beacon claim radius in blocks. RANGE upgrade modules add to this per colony. (default 48; server-authoritative)
#minColonySpacing: Minimum distance between two colony beacons in the same dimension. A placement inside this radius is refused with a translated message rather than silently allowed. (default 192; server-authoritative)
#colonistsPerColony: Population cap per colony. Housing capacity can never raise the roster above this. The default leaves room for the Metropolis stage thresholds. (default 48; server-authoritative)
#founderColonistCount: Colonists that arrive with a newly placed colony beacon. They exist without housing (they are what builds the first housing) but still count toward colonistsPerColony and maxLoadedColonists. 0 disables founders, which also means autonomous construction never starts until you build housing by hand. (default 2; server-authoritative)
#maxLoadedColonists: Global cap on colonist entities alive at once across all loaded colonies. (default 300; server-authoritative)
#colonyTickIntervalTicks: How often a colony processes production, food and morale. Colonies are staggered across this interval so N colonies never tick on the same game tick. (default 100; server-authoritative)
#colonyTickBudgetMs: Millisecond budget for colony processing per game tick. The remainder of a batch is deferred to the next tick rather than blowing the tick time. (default 5; server-authoritative)
#aiActiveRadius: Distance from an owner or access-list member within which Neran AI runs at full rate. Beyond it Nerans start new walks far less often, but a walk already under way always finishes. Production carries on regardless. (default 64; server-authoritative)
#fixedTimeIsDay: In dimensions with a fixed time of day (no day/night cycle), whether Nerans keep a working day (true) or stay home as if it were always night (false). (default true; server-authoritative)
#debugFastGrowth: TESTING ONLY - leave false. Compresses colony timings for runtime verification: colony cycles and housing sweeps run five times as often and construction places four times as many blocks per cycle. (default false; server-authoritative)
#housingScanIntervalTicks: How often the claim is rescanned for housing blocks to recompute capacity and comfort. (default 600; server-authoritative)
#catchUpMaxHours: Cap on the offline window a colony catches up on when its chunk reloads. 0 disables catch-up entirely (colonies then only ever produce while loaded). (default 24; server-authoritative)
#catchUpEfficiency: Multiplier applied to consumption, life support and construction credit during offline catch-up (job stations do not produce while unloaded). Below 1.0 so there is no incentive to chunk-load a planet for free yield. (default 0.5; server-authoritative)
#foodPerColonistPerCycle: Food items consumed per colonist per colony tick. 0 makes colonies never hungry. (default 1; server-authoritative)
#oxygenMbPerColonistPerCycle: Millibuckets of oxygen gas burnt per colonist per colony tick to hold life support. (default 20; server-authoritative)
#oxygenGeneratorEnergyPerTick: Energy per tick the colony oxygen generator draws while running. (default 40; server-authoritative)
#lifeSupportGraceTicks: How long life support stays DEGRADED before it is considered FAILED. Failure drives morale decay; it never kills a colonist. (default 1200; server-authoritative)
#moraleBase: Morale baseline before any weighted term is applied. (default 50.0; server-authoritative)
#moraleWeightHousing: Weight of the housing-comfort term in the morale sum. (default 20.0; server-authoritative)
#moraleWeightFood: Weight of the food-stock term in the morale sum. (default 20.0; server-authoritative)
#moraleWeightLifeSupport: Weight of the life-support term in the morale sum. (default 30.0; server-authoritative)
#moraleWeightCrowding: Weight of the overcrowding penalty in the morale sum. (default 15.0; server-authoritative)
#moraleWeightHazard: Weight of the planet-hazard penalty in the morale sum. Only ever non-zero when Nerospace is installed and reports a hazardous planet. (default 10.0; server-authoritative)
#moraleChangeRate: Points morale moves toward its target per colony tick. Morale is never snapped. (default 2.0; server-authoritative)
#moraleWorkStopThreshold: Below this morale jobs halt and colonists idle. Colonists are never deleted. (default 20.0; server-authoritative)
#moraleMinMultiplier: Output multiplier floor at zero morale. Production is a curve down to this, not a cliff. (default 0.25; server-authoritative)
#jobSlotsPerColony: Base number of simultaneously worked job slots per colony. Research raises it. (default 4; server-authoritative)
#jobBaseRateMultiplier: Global scalar on every job's production rate. (default 1.0; server-authoritative)
#exportBufferSlots: Slots in the beacon's export buffer. Overflow blocks further export production rather than voiding items. (default 18; server-authoritative)
#exportValueMultiplier: Scalar on the credits paid when an export entry is sold from the datapack export table. With NeroEconomy installed, an item its Merchant Houses buy is priced at their live bid instead, and this multiplier does not apply to it. (default 1.0; server-authoritative)
#exportPayoutChunk: With NeroEconomy installed, the largest single payout one export sale is split into. Keep it at or below NeroEconomy's siblingMaxSinglePayout (1000 by default); a larger value is halved automatically when NeroEconomy refuses it. A sale stops at the first refused payout and the unpaid goods stay in the buffer. (default 1000; server-authoritative)
#stageRewardCredits: A one-off credit reward paid to a colony's owner each time the colony reaches a new stage (Settled, Growing, Thriving, Metropolis). Needs NeroEconomy; paid from its Reserve under the colony's daily budget. 0 (the default) turns it off. (default 0; server-authoritative)
#constructionEnabled: Whether colonies build their own structures from the datapack blueprints. false leaves every structure to the player; nothing else changes. (default true; server-authoritative)
#constructionBlocksPerCycle: Blocks a colony may place per colony tick while building. Deliberately small: a colony growing visibly over minutes reads as a colony, one that snaps into existence reads as a command block. (default 2; server-authoritative)
#constructionUnsuppliedFactor: Build-rate multiplier while a structure's materials are NOT in colony storage - the colonists fabricate from scrap instead, for free but slowly. Put the materials in storage (or the beacon) and the same build runs at full speed. 0 means an unsupplied colony never builds at all. (default 0.25; server-authoritative)
#constructionRequiresColonist: Whether a colony needs at least one living colonist to build. This is a roster check, not a proximity one: block placement is colony-tick logic and never depends on a colonist actually reaching the site. (default true; server-authoritative)
#maxAutoStructures: Structures a Settled colony may build for itself; each stage after Settled adds the same again. Each blueprint also carries its own smaller cap. (default 12; server-authoritative)
#outpostsPerColony: How many outposts one colony may parent. (default 4; server-authoritative)
#outpostClaimRadius: Claim radius of an outpost beacon. (default 16; server-authoritative)
#outpostColonistCap: Colonists an outpost may hold. (default 2; server-authoritative)
#outpostJobSlots: Job slots an outpost may work. (default 1; server-authoritative)
#outpostMaxDistance: Maximum distance between an outpost and its parent colony, same dimension only. (default 512; server-authoritative)
#accessLogEnabled: OFF by default. When on, a colony records {player UUID, action, timestamp} rows for administrative review - never chat, never IP, never coordinates. Rows expire after accessLogRetentionDays. See PRIVACY.md. (default false; server-authoritative)
#accessLogRetentionDays: How long an access-log row is kept before the retention sweep deletes it. (default 7; server-authoritative)
#erasureOwnedColonyPolicy: What happens to colonies owned by a player who requests erasure: transfer_to_server (the colony keeps running, ownerless - a co-op server is not griefed) or dissolve (the colony record is deleted). (default transfer_to_server; server-authoritative)
#gateWritesEnabled: Whether founding a colony opens Core's first_colony progression gate. NeroColonies never REQUIRES a gate to be open; this only controls the write. (default true; server-authoritative)
#thresholdEventsEnabled: Whether colony food/oxygen/morale threshold crossings are published on Core's event bus for other mods (e.g. NeroQuests objectives). Scope is a colony id, never a person. (default true; server-authoritative)
#linkModuleEnabled: Whether the NeroLink companion module is registered. Snapshots are per-player scoped and never enumerate other players. (default true; server-authoritative)
#stageGrowingPopulation: Nerans a Settled colony needs (with stageGrowingStructures) to become Growing. (default 6; server-authoritative)
#stageGrowingStructures: Finished structures a Settled colony needs (with stageGrowingPopulation) to become Growing. (default 6; server-authoritative)
#stageThrivingPopulation: Nerans needed to become Thriving (unlocks the extravagant buildings). (default 16; server-authoritative)
#stageThrivingStructures: Finished structures needed to become Thriving. (default 14; server-authoritative)
#stageMetropolisPopulation: Nerans needed to become a Metropolis (unlocks the showpieces). (default 32; server-authoritative)
#stageMetropolisStructures: Finished structures needed to become a Metropolis. (default 24; server-authoritative)
#growthMaxBuildMultiplier: Ceiling of the construction-speed curve. A new colony builds at 1x; a large one approaches this. See the Progression wiki page for the formula. (default 3.0; server-authoritative)
#growthMaxClaimBonus: Ceiling of the claim-radius bonus a colony earns as it grows, in blocks. (default 32; server-authoritative)
#breedingEnabled: Whether Growing colonies with spare food and beds have children. Arrivals continue either way. (default true; server-authoritative)
#breedingBaseChance: Base chance per colony cycle of a birth when conditions allow; scaled up by colony size. (default 0.08; server-authoritative)
#breedingSurplusCycles: Cycles of food for the whole colony that must be in store before a birth is possible. (default 10; server-authoritative)
#immigrationIntervalCycles: Once a colony is Growing (and breeding is on), a newcomer arrives only every this many cycles, so free beds go mostly to children. 1 = an arrival every cycle, as before Growing. (default 6; server-authoritative)
#breedingMoraleFloor: Morale a colony needs before children are born. (default 50.0; server-authoritative)
#childGrowthDays: In-game days a child Neran takes to grow up and pick a trade. 0 = grown at once. (default 2; server-authoritative)
#maxBlueprintFootprint: Largest footprint (either axis) the colony will build. Bigger blueprints are skipped. (default 32; server-authoritative)
#maxBlueprintHeight: Tallest blueprint the colony will build. Taller ones are skipped. (default 40; server-authoritative)
#landClearingEnabled: Whether Nerans clear natural blocks (tag nerocolonies:clearable) from a building site. Drops go to colony storage. Never touches nerocolonies:protected or other structures. (default true; server-authoritative)
#maxConcurrentPlans: How many hand-placed building plans a colony may have queued at once. (default 4; server-authoritative)
#guardsAttackEnemyPlayers: Whether guards and guardian animals attack players on the colony's Enemy list. Hostile mobs are always fair game. (default true; server-authoritative)
#guardPursuitMargin: How far beyond the claim edge guards will chase a target. (default 16; server-authoritative)
#cacheStockIntervalCycles: Colony cycles between Gratitude Cache rolls by the Quartermaster. (default 36; server-authoritative)
#neranNamesEnabled: Whether new Nerans get a generated display name from the language file's name pool. (default true; server-authoritative)
