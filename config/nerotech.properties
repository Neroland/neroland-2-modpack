#NeroTech config (managed by Neroland Core). Tier-1 Earth machine balance.
#machineEnergyCapacity: internal NE buffer of every Tier-1 machine (default 100000; server-authoritative)
#machineMaxTransfer: max NE/tick a machine accepts or emits per side (default 2000; server-authoritative)
#neroGeneratorNePerTick: NE/tick produced by the Nero Generator while burning fuel (default 40; server-authoritative)
#solarArrayNePerTick: NE/tick produced by the Solar Array in full daylight with sky access (default 10; server-authoritative)
#windTurbineNePerTick: base NE/tick produced by the Wind Turbine before the height curve (0.5x at y=80 rising linearly to 2x at y=200) and the dimension multiplier (default 25; server-authoritative)
#windDimensionMultipliers: per-dimension wind multiplier: comma-list of dimensionId=multiplier (any dimension not listed defaults to 1.0). When Nerospace is installed an AIRLESS planet always yields 0 \u2014 no atmosphere, no wind \u2014 ahead of this table (default minecraft:overworld=1.0; server-authoritative)
#geothermalNePerTickPerSource: NE/tick the Geothermal Generator produces per lava / magma block in the 3x3 directly beneath it (0-9 sources) (default 8; server-authoritative)
#bioGeneratorNePerBurnTick: NE/tick produced by the Bio Generator while burning a #nerotech:bio_fuels item \u2014 20% above the Nero Generator, for half the pollution (default 48; server-authoritative)
#batteryBankCapacity: internal NE buffer of one Battery Bank (default 1000000; server-authoritative)
#gridControllerRadius: block radius the Grid Controller watches for NeroTech machines (loaded chunks only, batched every 100 ticks \u2014 large radii make each scan pass more expensive) (default 16; server-authoritative)
#gridShedThresholdPermille: aggregate grid fill (permille) below which the Grid Controller sheds load by switching non-generator machines to the Eco preset (default 200; server-authoritative)
#gridRestorePermille: aggregate grid fill (permille) above which the Grid Controller restores each shed machine's previous preset (keep it above gridShedThresholdPermille to avoid flapping) (default 500; server-authoritative)
#wirelessNodeRange: maximum block distance between two paired Wireless Power Nodes (same dimension only; a node never force-loads its partner's chunk) (default 32; server-authoritative)
#wirelessNodeTransferPerTick: NE a Wireless Power Node sends to its partner per transfer pass (the pass runs every 5 ticks); transfer is lossless \u2014 the node's value is convenience, not gain (default 200; server-authoritative)
#machineBaseProcessTicks: base ticks one Ore Processor / Fabricator operation takes (before Speed modules) (default 120; server-authoritative)
#machineNePerTick: base NE/tick a processing machine consumes while working (before Efficiency) (default 30; server-authoritative)
#heatCapacity: max heat units a machine can hold (gauge scale) (default 1000; server-authoritative)
#heatPerOperation: heat added each working tick (generators: per burn tick) (default 4; server-authoritative)
#heatDissipationPerTick: extra heat shed per adjacent coolant block (water/ice/snow) each tick (default 1; server-authoritative)
#heatThrottleThreshold: processing machines stall once heat reaches this (must cool to resume) (default 800; server-authoritative)
#thermalEnvLossPermille: permille of the machine-vs-ambient heat difference exchanged with the environment each tick (machines relax toward ambient; 0 disables) (default 20; server-authoritative)
#thermalConductivityPermille: permille of the heat difference conducted between ADJACENT machines per exchange (dense builds share heat; 0 disables machine-to-machine conduction) (default 100; server-authoritative)
#thermalExchangeIntervalTicks: how often (ticks) a machine conducts heat with cached adjacent machines (interval + per-machine phase \u2014 never a per-tick neighbour scan) (default 10; server-authoritative)
#thermalAmbientDefault: baseline ambient heat for dimensions not listed in thermalAmbientByDimension (default 0; server-authoritative)
#thermalAmbientByDimension: per-dimension ambient heat: comma-list of dimensionId=heat, e.g. minecraft:the_nether=150,nerospace:cindara=200 (FALLBACK since Stage H: nerospace.api planet traits take precedence for known planets when Nerospace is installed; this covers everything else) (default minecraft:the_nether=150; server-authoritative)
#thermalBiomeScale: ambient heat added per full point of biome base temperature above vanilla plains (0.8): deserts run hot, snowy biomes run cold (0 disables biome flavour) (default 50; server-authoritative)
#machineGasCapacity: capacity (mB) of each internal machine gas tank; one balance "unit" of gas is 100 mB (capacity changes apply when the machine next loads) (default 4000; server-authoritative)
#machineFluidCapacity: capacity (mB) of each internal machine fluid tank \u2014 the Electrolyzer's water tank (4 buckets by default) (default 4000; server-authoritative)
#electrolyzerNePerTick: NE/tick the Electrolyzer draws while splitting water (before Efficiency) (default 40; server-authoritative)
#electrolyzerOperationTicks: base ticks one electrolysis operation takes (before Speed modules) (default 200; server-authoritative)
#electrolyzerWaterPerOp: water (mB) consumed per electrolysis operation (a bucket is 1000 mB) (default 500; server-authoritative)
#electrolyzerHydrogenPerOp: hydrogen (mB) produced per operation \u2014 2 units at the default 100 mB/unit (default 200; server-authoritative)
#electrolyzerOxygenPerOp: oxygen (mB) produced per operation \u2014 1 unit; the 2:1 split is the point (default 100; server-authoritative)
#gasTurbineNePerUnit: NE one unit (100 mB) of gas yields, before the fuel's turbineGasBurn multiplier. Clean power, not free power: electrolysis is a net energy SINK by design (default 60; server-authoritative)
#gasTurbineTicksPerUnit: ticks one unit of gas burns for (the NE yield is spread evenly across them) (default 20; server-authoritative)
#turbineGasBurn: which gases the Gas Turbine burns and how well: comma-list of gasId=multiplier, e.g. nerotech:hydrogen=2,nerospace:oxygen=1. Yield per unit is gasTurbineNePerUnit x multiplier; a gas not listed here is not accepted at all (default nerotech:hydrogen=2; server-authoritative)
#chemicalProcessorGasPerOp: oxygen (mB) one Chemical Processor operation consumes on top of its NE (default 250; server-authoritative)
#coolantPumpNePerTick: NE/tick the Coolant Pump draws while pumping (billed in one batch per thermalExchangeIntervalTicks, never per tick) (default 20; server-authoritative)
#coolantPumpHeatPerOp: heat the Coolant Pump pulls from EACH adjacent machine per exchange, before the radiator multiplier (each Radiator within 3 blocks in a straight line adds +1x) (default 20; server-authoritative)
#roboticArmNePerMove: NE the Robotic Arm spends per ITEM moved (it runs one transfer pass per second; a pass moves at most roboticArmStackPerMove items) (default 4; server-authoritative)
#roboticArmStackPerMove: how many items one Robotic Arm transfer pass moves (before Speed modules) (default 8; server-authoritative)
#singularityVaultCapacity: how many of ONE item type a Singularity Vault holds (the two facade slots sit on top of this; a comparator reads fill against it) (default 1000000; server-authoritative)
#pollutionPerOperation: pollution a machine emits per contribution (0 disables; solar emits none) (default 2; server-authoritative)
#pollutionContributionIntervalTicks: how often (ticks) a running machine adds to its region (batched, not per-tick) (default 40; server-authoritative)
#pollutionDecayIntervalTicks: how often (ticks) regional pollution decays server-wide (default 200; server-authoritative)
#pollutionDecayAmount: pollution removed from each region per decay step (default 1; server-authoritative)
#pollutionPerPlayerAttribution: OFF by default (privacy): when true, pollution is attributed to the placing player's UUID (POPIA/GDPR: UUIDs only, retention-pruned, erasable via the shared data-erasure hook) (default false; server-authoritative)
#pollutionAttributionRetentionDays: days to keep per-player pollution attribution before pruning (0 = keep until erased) (default 30; server-authoritative)
#pollutionEventThreshold: regional pollution level that publishes a Core threshold event when crossed (rising and recovering; dormant until a listener like NeroEvents exists; 0 disables) (default 1000; server-authoritative)
#scrubberNePerOp: NE one Scrubber operation costs (batched on the contribution interval) (default 120; server-authoritative)
#scrubberPollutionPerOp: pollution removed from the Scrubber's own region per operation (default 6; server-authoritative)
#scrubberAdjacentPermille: permille of the scrub rate also removed from each of the 8 adjacent regions (default 25%; 0 = own region only) (default 250; server-authoritative)
#scrubberFilterCapacity: pollution one Filter Cartridge absorbs before it fouls into a Dirty Filter (default 400; server-authoritative)
#remediatorNePerOp: NE one Remediator operation costs \u2014 deliberately heavy; cleanup is a sink (default 600; server-authoritative)
#remediatorPollutionPerOp: pollution removed from the Remediator's own region per operation (default 20; server-authoritative)
#analyticsTerminalRadius: block radius an Analytics Terminal scans for NeroTech machines (loaded chunks only, batched every 100 ticks \u2014 large radii make each scan pass more expensive) (default 16; server-authoritative)
#fusionReactorNePerTick: NE/tick the Fusion Reactor produces while running (high-output late-game) (default 400; server-authoritative)
#fusionReactorMeltdownEnabled: true: an unmanaged Fusion Reactor melts down destructively at max heat (telegraphed by the red gauge); false (survival-friendly): it just stalls until it cools (default true; server-authoritative)
#fusionSizeOutputPermille: multiblock output multiplier (permille of fusionReactorNePerTick) per shell size: comma-list of size=permille for the 3/5/7 shells (Stage E multiblock) (default 3=1000,5=4000,7=12000; server-authoritative)
#fusionFuelTier1BurnTicks: burn ticks of one tier-1 fuel (Fusion Cell) charge (default 1600; server-authoritative)
#fusionFuelTier2BurnTicks: burn ticks of one tier-2 fuel (Plasma Cell) charge \u2014 needs a 5x5x5+ shell (default 4800; server-authoritative)
#fusionFuelTier3BurnTicks: burn ticks of one tier-3 fuel (Stellar Cell) charge \u2014 needs the 7x7x7 shell (default 14400; server-authoritative)
#fusionFuelTier4BurnTicks: burn ticks of one tier-4 fuel (Antimatter Cell) charge \u2014 twice a Stellar Cell, ONLY the 7x7x7 shell will contain it, and burning it adds +2 to the reactor's heat rate (the meltdown risk is the price) (default 28800; server-authoritative)
#advancedOreProcessorYieldBonus: extra dust the Advanced Ore Processor yields over the Tier-1 processor (default 1; server-authoritative)
#acceleratorMaxGap: blocks the Accelerator Controller marches along the current heading looking for the next Accelerator Guide Coil; nothing found within this and the beam line is OPEN (default 16; server-authoritative)
#acceleratorMaxGuides: safety cap on guides in one traced beam line (a pathological build stops here and reads as an open line); the trace costs O(guides x acceleratorMaxGap) block reads (default 256; server-authoritative)
#acceleratorTickScale: blocks a particle travels per tick per unit of speed (0.05 = speed 100 covers 5 blocks/tick) (default 0.05; server-authoritative)
#acceleratorLaunchSpeed: floor on the injection speed; the controller actually injects at the slowest speed the loop's LONGEST stretch tolerates (see acceleratorMinGapAllowance), so a wide ring starts fast and a tight one crawls (default 10.0; server-authoritative)
#acceleratorBoostPerGuide: speed a powered Accelerator Guide Coil adds as the particle passes (default 2.0; server-authoritative)
#acceleratorNePerGuide: NE the controller spends per guide passed (and once to inject); with no NE the particle coasts instead of accelerating (default 50; server-authoritative)
#acceleratorDragPerGuide: speed an UNPOWERED guide bleeds off a coasting particle \u2014 coast long enough and it drops below the gap rule and is lost (default 0.5; server-authoritative)
#acceleratorMinGapAllowance: gap rule: the longest stretch a particle at speed 0 could cross. The real allowance is this + speed x acceleratorGapPerSpeed \u2014 slow particles need close guides (default 4.0; server-authoritative)
#acceleratorGapPerSpeed: gap rule: extra blocks of allowed stretch per unit of speed (default 0.12; server-authoritative)
#acceleratorBendSpeedBase: bend rule: a 45 degree turn survives a speed of at most this x the length of the stretch before it \u2014 the shortest bend stretch in a loop caps the whole loop's top speed, so big rings are what buy big speeds (default 20.0; server-authoritative)
#acceleratorEnergyScale: permille scale in the collision energy formula E = 0.5 x speed^2 x scale; collider recipes gate on the resulting joules (default 500; server-authoritative)
#solarDimensionMultipliers: per-dimension solar multiplier FALLBACK (since Stage H, nerospace.api planet traits take precedence for known planets when Nerospace is installed): comma-list of dimensionId=multiplier, e.g. nerospace:greenxertz=1.5,nerospace:glacira=0.6 (Earth defaults to 1.0) (default ; server-authoritative)
#telemetryEnabled: anonymous error reporting to the developers (stack trace + mod/MC/loader/OS/Java versions only \u2014 never names, UUIDs, IPs, or world data; POPIA/GDPR-compliant). Set false to opt out (default true)
#renderAnimationsEnabled: animated machine visuals (spinning turbines/drums, sun-tracking solar deck, fabricator arms, plasma torus, holograms). Set false on low-end clients: block-entity renderers then draw a single static parked frame instead (default true)
