#Nerospace config (managed by Neroland Core). All multipliers 0.1..10, default 1.
#telemetryEnabled: send anonymous, Nerospace-only crash reports (Sentry, EU servers) - stack trace, mod/MC/loader/OS/Java versions, your other installed mods, this mod's config, recent in-game actions, anonymous stability/timing; no IP, username, UUID, world data or chat; file paths scrubbed of your account name. false = opt out of all of it. See PRIVACY.md (default true)
#energyRateMultiplier: scales FE/tick of all generators (combustion, passive, solar) (default 1.0; server-authoritative)
#oxygenDrainMultiplier: scales how fast air drains off a safe zone (default 1.0; server-authoritative)
#oxygenCapacityMultiplier: scales player + suit air capacity (default 1.0; server-authoritative)
#fuelCostMultiplier: scales fuel burned per rocket launch (clamped to the tank) (default 1.0; server-authoritative)
#machineSpeedMultiplier: scales machine work speed (higher = faster) (default 1.0; server-authoritative)
#gravityMultiplier: global scale on per-dimension/per-biome gravity (higher = stronger) (default 1.0; server-authoritative)
#quarryMaxSide: max quarry landmark claim side in blocks (4..64, default 64) (default 64; server-authoritative)
#quarryFrameDecayTicks: base delay in ticks before an orphaned quarry frame block crumbles and drops its casing; each block waits base + rand(base*7), so the default 600 spreads the ring's decay over ~30s..4min (20..24000) (default 600; server-authoritative)
#alienRaidsEnabled: allow hostile mobs to raid alien villages at night (true by default; false = opt out) (default true; server-authoritative)
#terraformerForceLoadEnabled: a running Terraformer keeps a small window of chunks loaded so it terraforms while you are away (false by default; opt-in - costs server memory/TPS while it runs) (default false; server-authoritative)
#linkModuleEnabled: expose Nerospace data to the NeroLink companion bridge (your own rockets, stations, planets, life support and Star Guide progress - never another player's). true by default; false = the companion app reports Nerospace as absent. Server-authoritative: the server decides (default true; server-authoritative)
#welcomeMessageEnabled: show the two-line Nerospace welcome in chat when a player joins (the Star Guide prompt plus the feedback link). true by default; false = join silently. Server-authoritative: the server sends the message, so the server decides (default true; server-authoritative)
#cargoPadSlots: usable cargo slots on a Cargo Pad = the payload a cargo rocket carries (1..27) (default 18; server-authoritative)
#cargoFuelCapacity: rocket fuel (mB) a Cargo Pad's pipe-fed fuel buffer holds (default 16000; server-authoritative)
#cargoTravelTimeMultiplier: scales cargo-rocket travel time (higher = slower flights) (default 1.0; server-authoritative)
#cargoHoldRetrySeconds: how often a holding cargo flight retries its landing (seconds) (default 30; server-authoritative)
#cargoHoldTimeoutMinutes: how long a cargo flight holds before its cargo is dropped as a crate at the destination (minutes; cargo is never deleted) (default 30; server-authoritative)
#cargoFlightRetentionDays: in-game days a completed cargo flight record is kept before it is pruned (default 7; server-authoritative)
#cargoMaxFlightsPerOwner: concurrent live cargo flights one player may have (default 16; server-authoritative)
#cargoMaxPads: hard cap on registered Cargo Pads (keeps a grief-spammed registry small) (default 256; server-authoritative)
#economyFirstVisitReward: credits paid once when a player first reaches each planet (0 = off; needs NeroEconomy, paid from its Reserve and subject to its sibling budgets) (default 0; server-authoritative)
#economyLaunchFee: credits charged per crewed or cargo rocket launch (0 = off; needs NeroEconomy; a player who cannot pay is refused the launch) (default 0; server-authoritative)
#economyDockingFee: credits charged per flight bound for an orbital station, on top of the launch fee (0 = off; needs NeroEconomy) (default 0; server-authoritative)
#Tue Oct 13 22:02:56 SAST 2026
alienRaidsEnabled=true
cargoFlightRetentionDays=7
cargoFuelCapacity=16000
cargoHoldRetrySeconds=30
cargoHoldTimeoutMinutes=30
cargoMaxFlightsPerOwner=16
cargoMaxPads=256
cargoPadSlots=18
cargoTravelTimeMultiplier=1.0
economyDockingFee=0
economyFirstVisitReward=0
economyLaunchFee=0
energyRateMultiplier=1.0
fuelCostMultiplier=1.0
gravityMultiplier=1.0
linkModuleEnabled=true
machineSpeedMultiplier=1.0
oxygenCapacityMultiplier=1.0
oxygenDrainMultiplier=1.0
quarryFrameDecayTicks=600
quarryMaxSide=64
telemetryEnabled=true
terraformerForceLoadEnabled=false
welcomeMessageEnabled=true
