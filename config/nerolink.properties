#NeroLink companion-bridge configuration.
#enabled: Master switch. When false the bridge binds no socket and serves nothing. (default true; server-authoritative)
#port: TCP port the HTTP + WebSocket bridge binds (server-start). Change needs a restart. (default 25580; server-authoritative)
#bindAddress: Interface the direct-mode listener binds on a DEDICATED server. 0.0.0.0 = all interfaces (LAN / port-forwarded phones can connect directly); 127.0.0.1 = this machine only (use the relay for phones). Single-player worlds always bind 127.0.0.1 unless singleplayerLanAccess=true. Traffic is always TLS-encrypted (see tlsEnabled). (default 0.0.0.0; server-authoritative)
#directEnabled: Run the direct-mode listener (LAN / port-forward). Set false to use the relay only; the relay tunnel is outbound and needs no listener. (default true; server-authoritative)
#tlsEnabled: Encrypt the direct-mode listener with the bridge's self-signed certificate, which the companion app pins at pairing (config/nerolink/bridge-tls.p12; delete it to rotate - every device must then re-pair). The NeroLink app's direct mode requires this. false is only for local tooling: plain HTTP is refused unless bindAddress is 127.0.0.1. (default true; server-authoritative)
#singleplayerLanAccess: Let phones on your network reach the bridge while you play single-player. Off by default, so a single-player world never opens a network port on its own. (default false; server-authoritative)
#rateLimitPerMinute: Per-token REST request budget per rolling minute. 429 + retryAfterMs on breach. (default 60; server-authoritative)
#maxClients: Global cap on concurrent live-update (WebSocket) connections, direct + relay. Protects a busy server; extra connections are refused until one closes. (default 64; server-authoritative)
#maxDevicesPerPlayer: How many devices one player may pair at once. Pairing beyond this is refused; revoke one with /nerolink revoke <device-id>. (default 5; server-authoritative)
#tokenExpiryDays: Device tokens expire after this many days of inactivity; expired devices are deleted by a periodic sweep (and every token expires after 365 days regardless). (default 90; server-authoritative)
#readOnly: Read-only bridge: all POST /actions are refused with ACTION_DISABLED. Snapshots still served. (default false; server-authoritative)
#allowOfflineActions: When false, every action requires the player be online, ignoring each action's allowOffline flag. (default true; server-authoritative)
#actionsDisabled: Comma-separated module/action ids to disable globally, e.g. "nerologistics/craft_order,core/ack_alert". (default ; server-authoritative)
#snapshotCadenceHotMs: Reserved for snapshot caching (not used yet). WS deltas already batch to at most one per second. (default 5000; server-authoritative)
#snapshotCadenceColdMs: Reserved for snapshot caching of cold sections (not used yet). (default 30000; server-authoritative)
#relayOrigin: Relay base origin used by /nerolink setup to register this server, e.g. https://relay.nerolandmc.net. /nerolink setup [origin] posts to <origin>/register and stores the returned credentials per-world; you do not edit relayUrl/relayKey by hand. (default https://relay.nerolandmc.net; server-authoritative)
#relayUrl: MANUAL OVERRIDE (advanced): relay tunnel URL, e.g. wss://relay.nerolandmc.net/tunnel/<serverId>. Blank = use the /nerolink setup registration instead. When BOTH relayUrl and relayKey are set they take precedence over the stored setup registration; otherwise leave both blank and use /nerolink setup. (default ; server-authoritative)
#relayKey: MANUAL OVERRIDE (advanced): server key paired with relayUrl - keep secret, never logged. Blank = use the /nerolink setup registration instead. Set BOTH relayUrl and relayKey to override the stored setup credentials; otherwise leave blank and use /nerolink setup. (default ; server-authoritative)
#privacyNoticeText: Data-processing notice returned by GET /privacy/notice and shown at first pairing. (default This server's NeroLink bridge stores, keyed to your Minecraft account: a hashed device token, the device name you enter, when you paired and last connected, and your notification preferences. Devices you stop using are deleted automatically. No email, no location, no chat. Everything shown is your own data. You can export or delete it from the app's Privacy settings at any time. If this server uses a NeroLink relay, your requests pass through it (encrypted to the relay, operated on Cloudflare) without their content being stored there.)
#telemetryEnabled: Anonymous error reporting to the developers (stack trace + mod/MC/loader/OS/Java versions only \u2014 never tokens, pairing codes, relay keys, names, UUIDs, IPs, or world data; POPIA/GDPR-compliant, EU servers). Set false to opt out. (default true)
#Tue Oct 13 22:02:55 SAST 2026
actionsDisabled=
allowOfflineActions=true
bindAddress=0.0.0.0
directEnabled=true
enabled=true
maxClients=64
maxDevicesPerPlayer=5
port=25580
privacyNoticeText=This server's NeroLink bridge stores only\: a hashed device token, your notification preferences, and pending pairing codes - all keyed to your Minecraft account and erasable on request. No email, no location, no chat. All data shown is scoped to you.
rateLimitPerMinute=60
readOnly=false
relayKey=
relayOrigin=https\://nerorelay.neroserver.xyz
relayUrl=
singleplayerLanAccess=false
snapshotCadenceColdMs=30000
snapshotCadenceHotMs=5000
telemetryEnabled=true
tlsEnabled=true
tokenExpiryDays=90
