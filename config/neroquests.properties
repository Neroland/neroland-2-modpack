#NeroQuests configuration.
#telemetryEnabled: send anonymous, NeroQuests-only crash reports (Sentry, EU servers) - stack trace, mod/MC/loader/OS/Java versions, your other installed mods, this mod's config, recent in-game actions, anonymous stability/timing; no IP, username, UUID, world data, quest progress or chat; file paths scrubbed of your account name. false = opt out of all of it. See PRIVACY.md (default true)
#gateWritesEnabled: Whether quest rewards write Neroland Core progression-gate flags. Disable to run NeroQuests as pure content without enforcing ecosystem progression. (default true; server-authoritative)
#missingModObjectivePolicy: How objectives referencing an absent mod's content (unknown id / empty tag) behave: 'skip' (objective ignored, quest completable without it) or 'autocomplete' (objective counts as done immediately). (default skip; server-authoritative)
#questDataRetentionDays: Days of inactivity after which a player's quest progress is purged when Core's purge-inactive runs (0 = follow Core's dataRetentionDays only). (default 0)
#Mon Aug 03 23:18:54 SAST 2026
gateWritesEnabled=true
missingModObjectivePolicy=skip
questDataRetentionDays=0
telemetryEnabled=true
