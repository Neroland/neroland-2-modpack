#NeroQuests configuration.
#telemetryEnabled: send anonymous, NeroQuests-only crash reports (Sentry, EU servers) - stack trace, mod/MC/loader/OS/Java versions, your other installed mods, this mod's config, recent in-game actions, anonymous stability/timing; no IP, username, UUID, world data, quest progress or chat; file paths scrubbed of your account name. On by default; set false to opt out of all of it (takes effect on restart). See PRIVACY.md (default true)
#gateWritesEnabled: Whether quest rewards write Neroland Core progression-gate flags. Disable to run NeroQuests as pure content without enforcing ecosystem progression. (default true; server-authoritative)
#missingModObjectivePolicy: How objectives referencing an absent mod's content (unknown id / empty tag) behave: 'skip' (objective ignored, quest completable without it) or 'autocomplete' (objective counts as done immediately). A quest with no objective present here is never completable under either policy. (default skip; server-authoritative)
#degradedCompletionsPay: Whether a quest completed with an objective auto-satisfied by missingModObjectivePolicy=autocomplete still pays its rewards. Off by default, so absent content can never be turned into free rewards. (default false; server-authoritative)
#owedItemsDropWhenFull: When a player's inventory cannot hold an item reward: false (default) keeps the overflow for them and delivers it once they have room; true drops it at their feet (the old behaviour). (default false; server-authoritative)
#dailyContractsEnabled: Offer daily hand-in contracts (/neroquests contracts). Their credit rewards need an economy with a budgeted payout API (NeroEconomy); without one no contract is offered. (default true; server-authoritative)
#dailyContractsPerDay: How many contracts are drawn from the contract pool each (UTC) day. A player is offered only those the economy's budget can still pay today. (default 3; server-authoritative)
#editorRequiresCreative: Whether being in Creative mode is enough to author custom quests (true, default). Set false so only operators at editorMinOpLevel and players on the editor allow-list may author. Spectators and dead players never may; /neroquests editor lock closes it for all but level 4. (default true; server-authoritative)
#editorMinOpLevel: Operator permission level that may author custom quests in any game mode. (default 2; server-authoritative)
#customQuestMaxTotal: Most custom (editor-made) quests this world may hold. (default 500; server-authoritative)
#customChapterMax: Most custom (editor-made) chapters this world may hold. (default 20; server-authoritative)
#customRewardMaxStacks: Most item-stack rewards one custom quest may pay (each at most one full stack). (default 9; server-authoritative)
#customRewardMaxXp: Most experience points one custom quest may pay per completion. (default 500; server-authoritative)
#customRewardMaxCurrency: Most currency one custom quest may pay per completion (paid through the economy's budgeted payouts when NeroEconomy is installed). (default 1000; server-authoritative)
#customRewardsEscrowed: When true, item rewards of custom quests must be deposited by the author (taken from their inventory, refunded when changed or deleted) and are paid from that deposit; loot-table rewards are refused. For servers that let non-operators author quests. (default false; server-authoritative)
#customCurrencyDailyCap: Most credits custom (editor-made) quests may pay out in this world per UTC day, all players together (0 = no world-wide cap). A payout past the cap is reduced or withheld and the player is told. (default 2000; server-authoritative)
#customRewardsPerPlayerDaily: Most paid completions of custom (editor-made) quests one player may receive per UTC day (0 = no limit). Further completions that day still complete but pay nothing; the player is told. (default 20; server-authoritative)
#customLootTablePrefixes: Comma-separated loot-table id prefixes a custom (editor-made) quest's loot_table reward may name. Empty = no loot-table rewards for custom quests. Each loot_table reward also counts as one slot toward customRewardMaxStacks. (default minecraft:chests/,minecraft:gameplay/fishing; server-authoritative)
#questDataRetentionDays: Days of inactivity after which a player's quest progress is purged when Core's purge-inactive runs (0 = follow Core's dataRetentionDays only). (default 0)
#Tue Oct 13 22:02:55 SAST 2026
customChapterMax=20
customCurrencyDailyCap=2000
customLootTablePrefixes=minecraft\:chests/,minecraft\:gameplay/fishing
customQuestMaxTotal=500
customRewardMaxCurrency=1000
customRewardMaxStacks=9
customRewardMaxXp=500
customRewardsEscrowed=false
customRewardsPerPlayerDaily=20
dailyContractsEnabled=true
dailyContractsPerDay=3
degradedCompletionsPay=false
editorMinOpLevel=2
editorRequiresCreative=true
gateWritesEnabled=true
missingModObjectivePolicy=skip
owedItemsDropWhenFull=false
questDataRetentionDays=0
telemetryEnabled=true
